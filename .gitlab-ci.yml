# Manually-triggered pipeline to edit the web directory tree.
#
# Launch from the GitLab web UI (works on mobile too):
#   Build → Pipelines → Run pipeline → pick branch `main`.
# The form below ("Inputs") shows named fields with descriptions, so there are
# no CI/CD variable names to remember — just pick an action and fill it in.
#
# One-time setup: create a Project Access Token (role: Maintainer, scope:
# write_repository) and store it as a masked CI/CD variable named PUSH_TOKEN
# (Settings → CI/CD → Variables). This lets the pipeline push the commit back.

spec:
  inputs:
    action:
      description: "What to do: add a link, or add an (empty) folder."
      default: add-link
      options:
        - add-link
        - add-folder
    parent:
      description: "Slash path to the containing folder, e.g. web_directory/tools. Leave empty for the top level."
      default: ""
    url:
      description: "The link's URL (add-link only), e.g. https://example.com/"
      default: ""
    name:
      description: "snake_case label. Required for add-folder; optional for add-link (auto-derived from the URL when blank)."
      default: ""
    tooltip:
      description: "Hover description shown in the directory. Optional."
      default: ""
---

# Shared shell steps: build so committed output (writing/, index.html, dist/)
# stays in sync, then commit & push back to the triggering branch. Each job
# sets COMMIT_MESSAGE before invoking this. GitLab flattens the nested list.
.commit_and_push: &commit_and_push
  - npm ci
  - npm run build
  - git config user.name "GitLab CI"
  - git config user.email "ci@deltadelta.dev"
  # The runner injects Git LFS hooks, whose pre-push/pre-commit abort when the
  # git-lfs binary is absent (it isn't in node:24). We touch no LFS-tracked
  # files here, so disable hooks by pointing core.hooksPath at an empty dir.
  - mkdir -p /tmp/no-hooks && git config core.hooksPath /tmp/no-hooks
  - git remote set-url origin "https://oauth2:${PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  - git add -A
  - git commit -m "$COMMIT_MESSAGE"
  # -o ci.skip keeps the pushed commit from triggering any future push pipelines.
  - git push -o ci.skip origin "HEAD:${CI_COMMIT_REF_NAME}"

.directory-edit:
  stage: build
  image: node:24
  variables:
    # Don't fetch the whole history; we only need the tip to commit on top of.
    GIT_DEPTH: "1"
  before_script:
    - test -n "$PUSH_TOKEN" || { echo "PUSH_TOKEN CI/CD variable is not set"; exit 1; }

add-link:
  extends: .directory-edit
  # Only the selected action runs; nothing runs on a normal push.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && "$[[ inputs.action ]]" == "add-link"'
  variables:
    LINK_URL: "$[[ inputs.url ]]"
    LINK_FOLDER: "$[[ inputs.parent ]]"
    LINK_NAME: "$[[ inputs.name ]]"
    LINK_TOOLTIP: "$[[ inputs.tooltip ]]"
  script:
    # Insert first; if it fails (bad input), the job stops before committing.
    - node scripts/add-link.js
    - export COMMIT_MESSAGE="Add ${LINK_NAME:-link} to ${LINK_FOLDER:-top level}"
    - *commit_and_push

add-folder:
  extends: .directory-edit
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && "$[[ inputs.action ]]" == "add-folder"'
  variables:
    FOLDER_NAME: "$[[ inputs.name ]]"
    FOLDER_PARENT: "$[[ inputs.parent ]]"
    FOLDER_TOOLTIP: "$[[ inputs.tooltip ]]"
  script:
    - node scripts/add-folder.js
    - export COMMIT_MESSAGE="Add folder ${FOLDER_NAME} to ${FOLDER_PARENT:-top level}"
    - *commit_and_push
