<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webring</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    :root {
      --bg: #fbfbf9;          /* near-white */
      --fg: #4a4a48;          /* de-saturated black/grey */
      --muted: #8a8780;       /* subtitles */
      --border: #000000;      /* solid black window border */
      --line: #d8d4ca;        /* button frames */
      --hover: #0000ee;       /* traditional hyperlink blue */
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, "Courier New", monospace;
      font-size: 15px;
      line-height: 1.7;
      margin: 0;
      padding: 1.5rem 1rem;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      border: 2px solid var(--border);
      padding: 1.5rem 1.75rem;
    }
    h1 { font-size: 1.5rem; line-height: 1.3; margin: 0 0 0.4rem; }
    .description { color: var(--muted); font-style: italic; margin: 0 0 1.75rem; }

    .ring { display: flex; flex-wrap: wrap; gap: 1rem; }
    .ring a {
      display: block;
      border: 1px solid var(--line);
      padding: 4px;
      line-height: 0;
    }
    .ring a:hover { border-color: var(--hover); }
    .ring img { height: 60px; width: auto; display: block; }
  </style>
</head>
<body>
  <main>
    <h1>webring</h1>
    <p class="description">Other webring sites I'm a part of, plus sites from myself or people close to me.</p>

    <div class="ring">
      <a href="https://www.zythia.art/" target="_blank" rel="noopener noreferrer" title="zythia.art">
        <img src="https://www.zythia.art/assets/button%20zythia.gif" alt="zythia.art">
      </a>
      <a href="https://www.aurailus.com/" target="_blank" rel="noopener noreferrer" title="aurailus.com">
        <img src="https://www.zythia.art/assets/button%20auri.png" alt="aurailus.com">
      </a>
      <a href="https://marcusbelcastro.com/" target="_blank" rel="noopener noreferrer" title="marcusbelcastro.com">
        <img src="https://marcusbelcastro.com/res/img/profile.webp" alt="marcusbelcastro.com">
      </a>
      <a href="https://www.youtube.com/@dstry_Flightman" target="_blank" rel="noopener noreferrer" title="dstry_Flightman">
        <img src="https://zythia.art/assets/button%20flightman.png" alt="dstry_Flightman">
      </a>
    </div>
  </main>
</body>
</html>
